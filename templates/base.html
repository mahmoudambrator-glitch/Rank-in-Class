<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة AMBRATOR</title>
    <!-- ربط ملف البيان لتطبيق الـ PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <!-- Bootstrap 5.3 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --dark-navy-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --gold-accent: #f59e0b;
            --transition-speed: 0.3s;
        }

        body { 
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* شريط التنقل العلوي بتدرج كحلي داكن فاخر تماماً مثل الصورة */
        .navbar-custom {
            background: linear-gradient(135deg, #09101d 0%, #172554 100%);
            box-shadow: 0 10px 25px -5px rgba(9, 16, 29, 0.4);
            border-bottom: 2px solid rgba(245, 158, 11, 0.2);
            backdrop-filter: blur(10px);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* زر ترتيب الدفعة بإطار ذهبي منسق وأيقونة كلاسيكية */
        .btn-gold-outline {
            background: transparent;
            border: 2px solid #f59e0b;
            color: #ffffff;
            font-weight: 600;
            border-radius: 50rem;
            padding: 0.4rem 1.25rem;
            transition: all var(--transition-speed) ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
        }

        .btn-gold-outline:hover {
            background: #f59e0b;
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        .alert {
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <!-- شريط التنقل العلوي -->
    <nav class="navbar navbar-dark navbar-custom sticky-top mb-4 py-3">
        <div class="container d-flex justify-content-between align-items-center">
            
            <!-- زر ترتيب الدفعة على اليسار -->
            <div class="d-flex align-items-center">
                <a class="btn btn-gold-outline btn-sm d-flex align-items-center gap-2" href="{{ url_for('student_ranking') }}">
                    <span>ترتيب الدفعة</span>
                    <i class="bi bi-trophy-fill text-warning fs-6"></i>
                </a>
            </div>

            <!-- عنوان المكتبة واسم AMBRATOR مع أيقونة الكتاب باللون الذهبي على اليمين -->
            <a class="navbar-brand brand-title m-0 text-end text-decoration-none" href="{{ url_for('home') }}">
                <div class="d-flex align-items-center gap-2">
                    <div>
                        <div class="fs-6 fw-bold" style="color: #cbd5e1; font-size: 0.85rem !important;">مكتبة</div>
                        <div class="text-white tracking-wider" style="font-size: 1.05rem;">AMBRATOR</div>
                    </div>
                    <div class="fs-3 text-warning">
                        <i class="bi bi-journal-bookmark-fill"></i>
                    </div>
                </div>
            </a>

        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="container py-2">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show border-0" role="alert">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-info-circle-fill fs-5"></i>
                    <div>{{ message }}</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
