<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة Ꭿ ᎷᏰ ᎡᎯ ᎿᏫᎡ ومنصة الترتيب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; }
        .brand-title {
            font-size: 17px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4 py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- اسم الموقع بحجم مصغر ومنع انقسامه -->
            <a class="navbar-brand brand-title fw-bold m-0" href="{{ url_for('home') }}">مكتبة Ꭿ ᎷᏰ ᎡᎯ ᎿᏫᎡ</a>
            
            <!-- زرار ترتيب الدفعة -->
            <div class="d-flex align-items-center">
                <a class="btn btn-outline-light btn-sm px-3" href="{{ url_for('student_ranking') }}">ترتيب الدفعة</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
