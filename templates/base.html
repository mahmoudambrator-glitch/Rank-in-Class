<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة AMBRATOR ومنصة الترتيب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
        }
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: #334155;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f8fafc !important;
            white-space: nowrap;
        }
        .btn-custom-outline {
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            transition: all 0.3s ease;
        }
        .btn-custom-outline:hover {
            background-color: #fff;
            color: #0f172a;
        }
        .card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-custom mb-4 py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand brand-title m-0" href="{{ url_for('home') }}">مكتبة AMBRATOR</a>
            <div class="d-flex align-items-center">
                <a class="btn btn-custom-outline btn-sm px-4 rounded-pill" href="{{ url_for('student_ranking') }}">ترتيب الدفعة</a>
            </div>
        </div>
    </nav>
    <div class="container py-2">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm border-0" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
