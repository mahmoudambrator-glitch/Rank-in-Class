<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الأعضاء - منصة ترتيب الدفعة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">🔒 لوحة تحكم الأعضاء والأرقام القومية السرية</h1>
        
        <div class="card shadow-sm p-4">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الطالب</th>
                        <th>الرقم القومي (سري)</th>
                        <th>الـ GPA</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ student.name }}</td>
                        <td><span class="badge bg-secondary">{{ student.nat_id }}</span></td>
                        <td>{{ student.gpa }}</td>
                        <td>{{ student.status }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-center text-muted">لا يوجد طلاب مسجلين حتى الآن.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">العودة للرئيسية</a>
        </div>
    </div>
</body>
</html>
