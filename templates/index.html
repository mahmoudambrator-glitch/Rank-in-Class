<!-- قائمة الأوائل (الترتيب) -->
        <div class="col-md-7">
            <div class="card shadow-sm p-4">
                <h4 class="card-title mb-3">🏆 قائمة المتصدرين (الأوائل)</h4>
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>الترتيب</th>
                            <th>الاسم</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in students %}
                        <tr>
                            <td><strong>#{{ loop.index }}</strong></td>
                            <td>{{ s.name }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="2" class="text-center text-muted">لا يوجد طلاب مسجلون حتى الآن</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
