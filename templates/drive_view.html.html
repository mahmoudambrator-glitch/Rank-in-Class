{% extends "base.html" %}
{% block content %}
<div class="container-fluid my-4">
    <!-- عرض رسائل التنبيه الفلاشية -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0">
                <!-- شريط العنوان العلوي -->
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h4 class="mb-0 text-truncate" title="{{ file_item.title }}">
                        <i class="bi bi-file-earmark-pdf-fill text-danger"></i> {{ file_item.title }}
                    </h4>
                    <div>
                        <!-- زر فتح أو تحميل مباشر من الدرايف -->
                        <a href="{{ file_item.file_path }}" target="_blank" class="btn btn-primary btn-sm fw-bold px-3">
                            <i class="bi bi-box-arrow-up-right"></i> فتح في تطبيق الدرايف
                        </a>
                    </div>
                </div>
                
                <!-- إطار عرض جوجل درايف (يعمل بكفاءة مطلقة على الموبايل والكمبيوتر) -->
                <div class="card-body p-0 bg-light" style="height: 80vh; min-height: 600px;">
                    <iframe src="{{ file_item.file_path }}" 
                            width="100%" 
                            height="100%" 
                            style="border: none;" 
                            allow="autoplay">
                    </iframe>
                </div>
            </div>

            <!-- زر العودة للمادة -->
            <div class="mt-3 text-start">
                <a href="{{ url_for('subject_detail', subject_id=file_item.subject_id) }}" class="btn btn-secondary shadow-sm">
                    <i class="bi bi-arrow-right"></i> العودة للمادة
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
