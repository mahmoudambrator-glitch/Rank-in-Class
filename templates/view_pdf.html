{% extends "base.html" %}
{% block content %}
<div class="container my-4 text-center">
    <h3 class="fw-bold mb-3 text-primary">{{ file_item.title }}</h3>
    
    <div class="card shadow p-2" style="height: 80vh;">
        <!-- عارض داخلي يجبر متصفح الموبايل على العرض لا التنزيل -->
        <iframe src="{{ url_for('static', filename=file_item.file_path) }}" width="100%" height="100%" style="border: none;">
            هذا المتصفح لا يدعم العرض، يمكنك التحميل من الزر أدناه.
        </iframe>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('open_file', file_id=file_item.id) }}" class="btn btn-success px-4 fw-bold" download>
            📥 تحميل الملف على جهازك
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary px-4 ms-2 fw-bold">العودة للخلف</a>
    </div>
</div>
{% endblock %}
