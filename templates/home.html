{% extends "base.html" %}
{% block content %}
<div class="row text-center mb-5">
    <div class="col-12">
        <h3 class="fw-bold text-dark mb-2">مرحباً بك في مكتبة AMBRATOR</h3>
        <p class="text-muted">اختر المادة لعرض الملخصات والملفات المتاحة</p>
        <hr class="w-25 mx-auto text-secondary opacity-25">
    </div>
</div>

<div class="row g-4">
    {% for sub in subjects %}
    <div class="col-md-4">
        <div class="card shadow-sm h-100 bg-white">
            <div class="card-body d-flex flex-column justify-content-between p-4">
                <div>
                    <h5 class="card-title text-dark fw-bold mb-3">{{ sub.name }}</h5>
                </div>
                <div class="mt-3">
                    <a href="{{ url_for('subject_detail', subject_id=sub.id) }}" class="btn btn-primary w-150 fw-bold py-2 rounded-pill shadow-sm">
                        عرض الملفات ({{ sub.files|length }})
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-light text-center border py-5 rounded-4 shadow-sm">
            <h5 class="text-muted mb-0">لا توجد مواد دراسية مضافة حتى الآن.</h5>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
