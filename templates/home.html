{% extends "base.html" %}
{% block content %}
<style>
    .welcome-card {
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        border: 1px solid #e2e8f0;
        border-radius: 20px;
    }
    .subject-card {
        background: #ffffff;
        border: none;
        border-radius: 16px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    }
    .subject-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        border-color: #cbd5e1;
    }
    .btn-main-action {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        border: none;
        color: white;
        transition: all 0.3s ease;
    }
    .btn-main-action:hover {
        background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
</style>

<div class="row text-center mb-5">
    <div class="col-12">
        <div class="p-4 welcome-card shadow-sm">
            <h3 class="fw-bold text-dark mb-2">مرحباً بك في ومكتبة Ꭿ ᎷᏰ ᎡᎯ ᎿᏫᎡ</h3>
            <p class="text-muted mb-0">اختر المادة الدراسية لعرض الملخصات والملفات المتاحة بسهولة</p>
        </div>
    </div>
</div>

<div class="row g-4">
    {% for sub in subjects %}
    <div class="col-md-4">
        <div class="card subject-card h-100 p-2">
            <div class="card-body d-flex flex-column justify-content-between p-3">
                <div>
                    <h5 class="card-title text-dark fw-bold mb-3">{{ sub.name }}</h5>
                </div>
                <div class="mt-3">
                    <a href="{{ url_for('subject_detail', subject_id=sub.id) }}" class="btn btn-main-action w-100 fw-bold py-2 rounded-pill shadow-sm">
                        عرض الملفات ({{ sub.files|length }})
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-light text-center border py-5 rounded-4 shadow-sm">
            <h5 class="text-muted mb-0">لا توجد مواد دراسية مضافة حتى الآن.</h5>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
